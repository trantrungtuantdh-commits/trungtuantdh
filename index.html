<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TNUT ProjectHub — Theo dõi tiến độ đồ án</title>
<style>
:root{--navy:#142B4A;--blue:#2563EB;--cyan:#06B6D4;--bg:#F5F7FB;--sf:#fff;--tx:#172033;--tx2:#64748B;--bd:#E2E8F0;--ok:#16A34A;--warn:#F59E0B;--bad:#DC2626;--ne:#94A3B8;--side:#142B4A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1220;--sf:#131C2E;--tx:#E6ECF5;--tx2:#94A3B8;--bd:#24304A;--side:#0A1526}}
:root[data-theme=dark]{--bg:#0B1220;--sf:#131C2E;--tx:#E6ECF5;--tx2:#94A3B8;--bd:#24304A;--side:#0A1526}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#app{display:flex;height:100%}
aside{width:248px;background:var(--side);color:#fff;display:flex;flex-direction:column;padding:16px 12px;transition:width .2s;flex-shrink:0;overflow:hidden}
aside.min{width:72px}aside.min .lb{display:none}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;padding:4px 8px 16px;white-space:nowrap}
.logo i{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;font-style:normal;flex-shrink:0}
nav button{display:flex;gap:12px;align-items:center;width:100%;padding:10px;border:0;background:none;color:#CBD5E1;border-radius:8px;cursor:pointer;margin-bottom:2px;white-space:nowrap;text-align:left}
nav button:hover{background:rgba(255,255,255,.08)}nav button.on{background:var(--blue);color:#fff}
nav .ic{width:20px;text-align:center;flex-shrink:0}
.demo{margin-top:auto;font-size:12px;color:#94A3B8;padding:8px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:12px 24px;background:var(--sf);border-bottom:1px solid var(--bd)}
header .sp{flex:1}header{flex-wrap:wrap}
.btn{border:1px solid var(--bd);background:var(--sf);padding:8px 14px;border-radius:8px;cursor:pointer;transition:.15s;min-height:36px}
.btn:hover{border-color:var(--blue)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.p:hover{filter:brightness(1.1)}
.btn.d{color:var(--bad)}.btn.sm{padding:4px 10px;min-height:28px;font-size:13px}
.ibtn{width:36px;height:36px;padding:0}
#content{flex:1;overflow:auto;padding:24px;max-width:100%}
h1{font-size:28px;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}
.sub{color:var(--tx2);margin:0 0 20px}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:20px}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:20px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;transition:box-shadow .15s}
.stat{cursor:pointer;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.stat:hover{box-shadow:0 4px 14px rgba(20,43,74,.12)}
.stat .n{font-size:26px;font-weight:700;line-height:1.1}.stat .l{color:var(--tx2);font-size:13px}
.stat .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);transition:width .4s}
.badge{display:inline-flex;gap:4px;align-items:center;font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.b-ok{background:#16A34A22;color:var(--ok)}.b-warn{background:#F59E0B26;color:#B45309}.b-bad{background:#DC262622;color:var(--bad)}.b-ne{background:#94A3B833;color:var(--tx2)}.b-bl{background:#2563EB22;color:var(--blue)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .b-warn{color:var(--warn)}}
.av{width:26px;height:26px;border-radius:50%;background:var(--cyan);color:#06303a;display:inline-grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row .g{flex:1;min-width:0}.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.small{font-size:12px;color:var(--tx2)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tools input,.tools select,.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);min-height:36px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}th{text-align:left;font-size:12px;color:var(--tx2);padding:8px;border-bottom:1px solid var(--bd)}td{padding:10px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:0 0 250px;background:var(--bd);background:color-mix(in srgb,var(--bd) 55%,transparent);border-radius:12px;padding:10px;min-height:160px;transition:outline .15s}
.col.over{outline:2px dashed var(--blue)}
.col h3{font-size:13px;margin:0 0 8px;display:flex;justify-content:space-between}
.tk{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab}
.tk.drag{opacity:.4}.tk .t{font-weight:600;margin-bottom:6px}
.tk .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tl{display:grid;grid-template-columns:170px 1fr;gap:8px 12px;align-items:center;min-width:560px}
.tl .tr{position:relative;height:22px;background:var(--bd);border-radius:6px}
.tl .tr i{position:absolute;top:3px;bottom:3px;border-radius:5px;background:var(--blue)}
.tl .tr b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad)}
.chart{display:flex;align-items:flex-end;gap:10px;height:140px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;gap:4px}
.chart i{display:block;width:100%;max-width:44px;border-radius:6px 6px 0 0;min-height:2px;transition:height .4s}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.5);display:none;place-items:center;z-index:30;padding:16px}.modal.show{display:grid}
.mbox{background:var(--sf);border-radius:14px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}.fld label{font-size:13px;font-weight:600}.fld input,.fld select,.fld textarea{width:100%}
.err{color:var(--bad);font-size:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50;align-items:center}
.ts{background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;animation:in .2s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
#fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;border:0;font-size:22px;cursor:pointer;box-shadow:0 6px 18px rgba(37,99,235,.4);z-index:20}
#chat{position:fixed;right:20px;bottom:84px;width:360px;max-width:calc(100vw - 24px);height:460px;max-height:calc(100% - 110px);background:var(--sf);border:1px solid var(--bd);border-radius:14px;display:none;flex-direction:column;z-index:25;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#chat.show{display:flex}
#chat .hd{background:var(--navy);color:#fff;padding:10px 14px;border-radius:13px 13px 0 0;display:flex;justify-content:space-between}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m1,.m2{padding:8px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap}
.m1{align-self:flex-end;background:var(--blue);color:#fff}.m2{align-self:flex-start;background:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}.chips button{font-size:12px;border:1px solid var(--bd);background:var(--sf);border-radius:99px;padding:4px 10px;cursor:pointer}
#chat form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--bd)}#chat input{flex:1;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--sf)}
#menu{display:none}
@media(max-width:820px){
aside{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .2s;width:248px!important}aside.open{transform:none}
#menu{display:inline-block}header{padding:10px 14px}#content{padding:16px}h1{font-size:22px}
.hide-m{display:none}.tl{grid-template-columns:110px 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;margin-bottom:20px;background:linear-gradient(135deg,var(--navy),#1d4ed8);color:#fff;border:0}
.hero svg{width:100%;height:auto;max-height:190px}.hero p{opacity:.85;margin:6px 0 0}
.rg{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-bottom:24px}
.lk{display:block;text-decoration:none;color:inherit;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;transition:.15s}
.lk:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(20,43,74,.12)}
.lk b{display:flex;justify-content:space-between;gap:8px;color:var(--blue)}
.ch{display:flex;gap:10px;align-items:center;margin:0 0 10px}.ch h2{margin:0}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
<aside id="side">
<div class="logo"><i>T</i><span class="lb">TNUT ProjectHub</span></div>
<nav id="nav"></nav>
<div class="demo lb">Dữ liệu lưu trên trình duyệt của bạn.<br>Không phải website chính thức của TNUT.</div>
</aside>
<main>
<header>
<button class="btn ibtn" id="menu" aria-label="Mở menu">☰</button>
<button class="btn ibtn hide-m" id="collapse" aria-label="Thu gọn thanh bên" title="Thu gọn">⇔</button>
<strong class="hide-m">Đồ án:</strong>
<select id="proj" class="btn" aria-label="Chọn đồ án"></select>
<span class="sp"></span>
<button class="btn" id="newP">+ Đồ án</button>
<button class="btn p" id="addTop">+ Nhiệm vụ</button>
<button class="btn" id="prof" aria-label="Hồ sơ">👤 <span id="pn" class="hide-m">Hồ sơ</span></button>
<button class="btn ibtn" id="theme" aria-label="Đổi giao diện sáng/tối" title="Sáng/Tối">◐</button>
</header>
<div id="content"></div>
</main>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>
<div id="toast" aria-live="polite"></div>
<div id="chat" role="dialog" aria-label="ProjectHub AI">
<div class="hd"><span>ProjectHub AI <small>· chế độ không dùng AI</small></span><button class="btn sm" id="cx" aria-label="Đóng">✕</button></div>
<div id="msgs"></div><div class="chips" id="chips"></div>
<form id="cf"><input id="ci" placeholder="Hỏi về tiến độ…" aria-label="Câu hỏi"><button class="btn p">Gửi</button></form>
</div>
<button id="fab" aria-label="Mở trợ lý">💬</button>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const off=n=>today()+n*DAY;
const fmt=t=>new Date(t).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});
const ST=[['todo','Chưa bắt đầu'],['doing','Đang thực hiện'],['wait','Đang chờ'],['block','Bị chặn'],['fix','Cần chỉnh sửa'],['done','Hoàn thành']];
const STN=Object.fromEntries(ST);
const PR={low:'Thấp',normal:'Bình thường',high:'Cao',urgent:'Khẩn cấp'};
const PRB={low:'b-ne',normal:'b-bl',high:'b-warn',urgent:'b-bad'};
const PROG={todo:0,doing:50,wait:30,block:20,fix:70,done:100};

const blank=()=>({me:'',projects:[],tasks:[],nid:1,pid:1});
let S=blank(),cur=0,view='dash',filt={q:'',st:'',pr:''};
try{const r=localStorage.getItem('tph_v2');if(r)S=Object.assign(blank(),JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('tph_v2',JSON.stringify(S))}catch(e){}};
const toast=m=>{const e=document.createElement('div');e.className='ts';e.textContent=m;$('#toast').append(e);setTimeout(()=>e.remove(),2600)};

const list=()=>S.tasks.filter(t=>!cur||t.p==cur);
const over=t=>t.st!=='done'&&t.d<today();
const soon=t=>t.st!=='done'&&t.d>=today()&&t.d<=off(3);
const prog=a=>{const w=a.reduce((s,t)=>s+t.w,0);return w?Math.round(a.filter(t=>t.st==='done').reduce((s,t)=>s+t.w,0)/w*100):0};
const ini=()=>(S.me.trim().split(/\s+/).pop()||'?')[0].toUpperCase();
const av=i=>i===0&&S.me?`<span class="av" title="${esc(S.me)}">${esc(ini())}</span>`:'<span class="small">—</span>';
const badge=t=>t.st==='done'?'<span class="badge b-ok">✔ Hoàn thành</span>':over(t)?'<span class="badge b-bad">⚠ Quá hạn</span>':t.st==='block'?'<span class="badge b-bad">⛔ Bị chặn</span>':soon(t)?'<span class="badge b-warn">⏰ Sắp đến hạn</span>':'';
const pj=id=>(S.projects.find(p=>p.id==id)||{}).name||'';

const NAV=[['dash','▦','Tổng quan'],['board','☷','Kanban'],['tasks','☰','Nhiệm vụ'],['time','▤','Timeline'],['pd','◧','Chi tiết đồ án'],['tpl','📋','Mẫu đồ án'],['res','🔗','Tài nguyên']];
function nav(){$('#nav').innerHTML=NAV.map(n=>`<button class="${view===n[0]?'on':''}" data-v="${n[0]}"><span class="ic">${n[1]}</span><span class="lb">${n[2]}</span></button>`).join('')+`<button data-ai="1"><span class="ic">✦</span><span class="lb">Trợ lý AI</span></button>`}
function go(v,f){view=v;if(f)filt={q:'',st:'',pr:'',...f};else if(v!=='tasks')filt={q:'',st:'',pr:''};$('#side').classList.remove('open');render()}
function render(){fillProj();nav();$('#content').innerHTML=({dash,board,tasks,time,pd,tpl,res})[view]();bind()}

function dash(){
if(!S.projects.length)return onboard();
const a=list(),n=a.length,ov=a.filter(over),sn=a.filter(soon),bl=a.filter(t=>t.st==='block'),dn=a.filter(t=>t.st==='done'),dg=a.filter(t=>t.st==='doing');
const card=(i,c,num,l,f)=>`<button class="card stat" data-go='${JSON.stringify(f)}'><span class="ico" style="background:${c}22;color:${c}">${i}</span><span><div class="n">${num}</div><div class="l">${l}</div></span></button>`;
const cnt=ST.map(s=>[s[1],a.filter(t=>t.st===s[0]).length]),mx=Math.max(1,...cnt.map(c=>c[1]));
const col=['#94A3B8','#2563EB','#06B6D4','#DC2626','#F59E0B','#16A34A'];
const wl=[[S.me?ini():'—',a.filter(t=>t.as<=0&&t.st!=='done').length]],wm=Math.max(1,...wl.map(w=>w[1]));
const att=[...ov.map(t=>[t,'Quá hạn '+Math.ceil((today()-t.d)/DAY)+' ngày']),...bl.map(t=>[t,'Bị chặn: '+esc(t.why||'chưa ghi lý do')]),...sn.map(t=>[t,'Đến hạn '+fmt(t.d)])];
const heavy=wl.filter(w=>w[1]>=3).map(w=>`Bạn đang có ${w[1]} nhiệm vụ mở — hãy ưu tiên theo hạn.`);
const my=a.filter(t=>t.as<=0&&t.st!=='done').sort((x,y)=>x.d-y.d).slice(0,5);
const hr=new Date().getHours();
return `<h1>${hr<12?'Chào buổi sáng':hr<18?'Chào buổi chiều':'Chào buổi tối'}${S.me?', '+esc(S.me.trim().split(/\s+/).pop()):''} 👋</h1>
<p class="sub">${new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · Dữ liệu do bạn nhập</p>
<div class="grid stats">
${card('◧','#2563EB',S.projects.length,'Đồ án tham gia',{})}
${card('☰','#142B4A',n,'Nhiệm vụ',{})}
${card('✔','#16A34A',dn.length,'Hoàn thành',{st:'done'})}
${card('▶','#06B6D4',dg.length,'Đang thực hiện',{st:'doing'})}
${card('⚠','#DC2626',ov.length,'Quá hạn',{st:'overdue'})}
${card('⏰','#F59E0B',sn.length,'Sắp đến hạn (3 ngày)',{st:'soon'})}
${card('⛔','#DC2626',bl.length,'Đang bị chặn',{st:'block'})}
<div class="card"><div class="l small">Tiến độ theo trọng số</div><div class="n" style="font-size:26px;font-weight:700">${prog(a)}%</div><div class="bar"><i style="width:${prog(a)}%"></i></div></div>
</div>
<div class="grid two">
<div class="card"><h2>Phân bố theo trạng thái</h2>${n?`<div class="chart">${cnt.map((c,i)=>`<div><span>${c[1]}</span><i style="height:${c[1]/mx*100}px;background:${col[i]}"></i><span class="small" style="text-align:center">${c[0]}</span></div>`).join('')}</div>`:'<p class="small">Chưa có nhiệm vụ. Nhấn “+ Nhiệm vụ” để bắt đầu.</p>'}</div>
<div class="card"><h2>Khối lượng việc đang mở</h2><div class="chart">${wl.map(w=>`<div><span>${w[1]}</span><i style="height:${w[1]/wm*100}px;background:var(--blue)"></i><span class="small">${w[0]}</span></div>`).join('')}</div>
<p class="small">Số nhiệm vụ chưa phản ánh độ lớn công việc; chỉ dùng để tham khảo.</p></div></div>
<div class="grid two">
<div class="card"><h2>Cần chú ý</h2>${att.length||heavy.length?att.map(([t,m])=>`<div class="row"><div class="g"><div class="t">${esc(t.t)}</div><div class="small">${m} · ${esc(pj(t.p))}</div></div><button class="btn sm" data-edit="${t.id}">Mở</button></div>`).join('')+heavy.map(h=>`<div class="row"><div class="g small">${esc(h)}</div></div>`).join(''):'<p class="small">Không có cảnh báo. 🎉</p>'}</div>
<div class="card"><h2>Việc của tôi</h2>${my.length?my.map(t=>`<div class="row"><input type="checkbox" data-done="${t.id}" aria-label="Hoàn thành ${esc(t.t)}"><div class="g"><div class="t">${esc(t.t)}</div><div class="small">Hạn ${fmt(t.d)}</div></div>${badge(t)}</div>`).join(''):'<p class="small">Bạn chưa có nhiệm vụ nào đang mở.</p>'}</div></div>`}

function board(){
return `<h1>Bảng Kanban</h1><p class="sub">Kéo thả thẻ giữa các cột để đổi trạng thái.</p>
<div class="kan">${ST.map(([k,l])=>{const a=list().filter(t=>t.st===k);return `<div class="col" data-col="${k}"><h3>${l}<span class="badge b-ne">${a.length}</span></h3>${a.map(t=>`<div class="tk" draggable="true" data-id="${t.id}" tabindex="0"><div class="t">${esc(t.t)}</div><div class="bar"><i style="width:${pct(t)}%"></i></div><div class="m">${av(t.as)}<span class="small">Hạn ${fmt(t.d)}</span><span class="badge ${PRB[t.pr]}">${PR[t.pr]}</span>${badge(t)}</div></div>`).join('')||'<p class="small">Trống</p>'}</div>`}).join('')}</div>`}

function tasks(){
let a=list().filter(t=>(!filt.q||t.t.toLowerCase().includes(filt.q.toLowerCase()))&&(!filt.pr||t.pr===filt.pr)&&(!filt.st||(filt.st==='overdue'?over(t):filt.st==='soon'?soon(t):t.st===filt.st))).sort((x,y)=>x.d-y.d);
return `<h1>Nhiệm vụ</h1><p class="sub">${a.length} kết quả</p>
<div class="tools"><input id="fq" placeholder="Tìm nhiệm vụ…" value="${esc(filt.q)}" aria-label="Tìm kiếm">

function time(){
const a=list().slice().sort((x,y)=>x.s-y.s);if(!a.length)return '<h1>Timeline</h1><p class="sub">Chưa có nhiệm vụ.</p>';
const min=Math.min(...a.map(t=>t.s),today()),max=Math.max(...a.map(t=>t.d),today()),sp=max-min||1,pc=x=>(x-min)/sp*100;
return `<h1>Timeline</h1><p class="sub">Vạch đỏ là hôm nay. Màu đỏ: quá hạn; xanh lá: hoàn thành.</p><div class="card scroll"><div class="tl">${a.map(t=>`<div class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(t.t)}">${esc(t.t)}</div><div class="tr"><i style="left:${pc(t.s)}%;width:${Math.max(1.5,pc(t.d)-pc(t.s))}%;background:${t.st==='done'?'var(--ok)':over(t)?'var(--bad)':t.st==='block'?'var(--warn)':'var(--blue)'}"></i><b style="left:${pc(today())}%"></b></div>`).join('')}</div>
<p class="small">${fmt(min)} → ${fmt(max)}</p></div>`}

S.projects.push({id,name:T.name,due:st+T.w*7*DAY,meta:{k:T.k,goal:T.goal,ms:T.ms.map(m=>({l:m[0],d:st+(m[1]*7-1)*DAY,tk:b+m[2]})),rs:T.rs.map(x=>({t:x,d:0}))}});
cur=id;save()}
function tpl(){return `<h1>Mẫu đồ án theo ngành</h1><p class="sub">Mẫu do ProjectHub đề xuất, không phải quy trình bắt buộc của TNUT. Mốc thời gian tính từ ngày bạn thêm và có thể sửa. Tiến độ bắt đầu từ 0% và tăng khi bạn tích các bước.</p><div class="tools"><button class="btn p" id="tplall">+ Thêm cả 4 mẫu</button></div><div class="grid rg" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${TPL.map((T,i)=>`<div class="card"><div class="ch">${ci(T.ic,'#2563EB')}<div><span class="badge b-bl">${T.k}</span><h2 style="font-size:16px;margin:4px 0 0">${esc(T.name)}</h2></div></div><p class="small">${esc(T.goal)}</p><p class="small">⏱ ${T.w} tuần · ${T.tk.length} nhiệm vụ · ${T.ms.length} mốc · ${T.rs.length} kết quả</p><ul class="small" style="padding-left:18px">${T.tk.map(k=>`<li>${esc(k[0])}</li>`).join('')}</ul><button class="btn p" data-tpl="${i}">Dùng mẫu này</button></div>`).join('')}</div>`}
function pd(){const P=S.projects.find(p=>p.id==cur)||S.projects[0];if(!P)return '<h1>Chi tiết đồ án</h1><p class="sub">Chưa có đồ án. Hãy tạo đồ án hoặc dùng một mẫu trong mục “Mẫu đồ án”.</p>';
const ts=S.tasks.filter(t=>t.p===P.id).sort((x,y)=>x.s-y.s),M=P.meta||{};
return `<h1>${esc(P.name)}</h1><p class="sub">${M.k?`<span class="badge b-bl">${esc(M.k)}</span> `:''}Hạn hoàn thành: ${new Date(P.due).toLocaleDateString('vi-VN')} · <button class="btn sm d" data-delp="${P.id}">Xóa đồ án</button></p>
<div class="grid two"><div class="card"><h2>Tiến độ</h2><div style="font-size:26px;font-weight:700">${prog(ts)}%</div><div class="bar"><i style="width:${prog(ts)}%"></i></div><p class="small">${ts.filter(t=>t.st==='done').length}/${ts.length} nhiệm vụ hoàn thành</p>${M.goal?`<h2 style="margin-top:12px">Mục tiêu</h2><p>${esc(M.goal)}</p>`:''}</div>
<div class="card"><h2>Mốc thời gian</h2>${(M.ms||[]).map(m=>{const t=S.tasks.find(x=>x.id===m.tk),ok=t&&t.st==='done';return `<div class="row"><div class="g"><div class="t">${esc(m.l)}</div><div class="small">${new Date(m.d).toLocaleDateString('vi-VN')}</div></div>${ok?'<span class="badge b-ok">✔ Đạt</span>':m.d<today()?'<span class="badge b-bad">⚠ Trễ mốc</span>':'<span class="badge b-ne">Chưa đến</span>'}</div>`}).join('')||'<p class="small">Đồ án tự tạo chưa có mốc. Dùng mẫu để có sẵn mốc thời gian.</p>'}</div></div>
<div class="card" style="margin-bottom:20px"><h2>Các bước thực hiện</h2>${ts.map(t=>`<div class="row"><div class="g"><div class="t">${esc(t.t)}</div><div class="small">${fmt(t.s)} → ${fmt(t.d)} · ${t.steps?t.steps.filter(x=>x.d).length+'/'+t.steps.length+' bước':STN[t.st]}</div><div class="bar"><i style="width:${pct(t)}%"></i></div></div>${badge(t)}<button class="btn sm" data-det="${t.id}">Chi tiết</button></div>`).join('')||'<p class="small">Chưa có nhiệm vụ.</p>'}</div>
<div class="card"><h2>Kết quả cần đạt</h2>${(M.rs||[]).map((r,i)=>`<label class="row" style="cursor:pointer"><input type="checkbox" data-rs="${P.id}:${i}" ${r.d?'checked':''}><span class="g">${esc(r.t)}</span></label>`).join('')||'<p class="small">Chưa có danh sách kết quả.</p>'}</div>`}
function det(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;
open_(`<h2>${esc(t.t)}</h2><p class="small">${esc(pj(t.p))} · ${fmt(t.s)} → ${fmt(t.d)}</p><div class="bar"><i style="width:${pct(t)}%"></i></div><p class="small">${STN[t.st]} · ${pct(t)}%</p>${(t.steps||[]).map((x,i)=>`<label class="row" style="cursor:pointer"><input type="checkbox" data-st="${i}" ${x.d?'checked':''}><span class="g">${esc(x.t)}</span></label>`).join('')||'<p class="small">Nhiệm vụ này chưa có bước chi tiết.</p>'}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn" data-x>Đóng</button><button class="btn p" id="ed">Sửa</button></div>`);
$('#ed').onclick=()=>{close_();edit(id)};
document.querySelectorAll('#mbox [data-st]').forEach(c=>c.onchange=()=>{t.steps[+c.dataset.st].d=c.checked?1:0;const n=t.steps.filter(x=>x.d).length;if(n===t.steps.length)t.st='done';else if(t.st==='todo'||t.st==='done')t.st=n?'doing':'doing';save();render();det(id)})}
function bind(){
document.querySelectorAll('[data-det]').forEach(b=>b.onclick=()=>det(+b.dataset.det));
document.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{useTpl(+b.dataset.tpl);go('pd');toast('Đã thêm đồ án từ mẫu')});
const all=$('#tplall');if(all)all.onclick=()=>{TPL.forEach((_,i)=>useTpl(i));cur=0;go('dash');toast('Đã thêm 4 đồ án mẫu')};
document.querySelectorAll('[data-rs]').forEach(b=>b.onchange=()=>{const[i,j]=b.dataset.rs.split(':').map(Number);S.projects.find(p=>p.id===i).meta.rs[j].d=b.checked?1:0;save()});
document.querySelectorAll('[data-delp]').forEach(b=>b.onclick=()=>{const id=+b.dataset.delp;if(confirm('Xóa đồ án và toàn bộ nhiệm vụ của nó?')){S.projects=S.projects.filter(p=>p.id!==id);S.tasks=S.tasks.filter(t=>t.p!==id);cur=0;save();render()}});
const ot=$('#otpl');if(ot)ot.onclick=()=>go('tpl');
const ob=$('#ob');if(ob)ob.onclick=()=>{const n=$('#o2').value.trim(),d=$('#o3').value;if(!n||!d){$('#oe').textContent='Vui lòng nhập tên đồ án và hạn hoàn thành';return}S.me=$('#o1').value.trim();addProj(n,d);render();toast('Đã tạo đồ án')};
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go('tasks',JSON.parse(b.dataset.go)));
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(+b.dataset.edit));
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(+b.dataset.del));
document.querySelectorAll('[data-done]').forEach(b=>b.onchange=()=>{setSt(+b.dataset.done,b.checked?'done':'doing')});
const q=$('#fq');if(q){q.oninput=()=>{filt.q=q.value;const p=q.selectionStart;render();const n=$('#fq');n.focus();n.setSelectionRange(p,p)};$('#fs').onchange=e=>{filt.st=e.target.value;render()};$('#fp').onchange=e=>{filt.pr=e.target.value;render()}}
document.querySelectorAll('.tk').forEach(c=>{c.ondragstart=e=>{e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('drag')};c.ondragend=()=>c.classList.remove('drag');c.ondblclick=()=>det(+c.dataset.id)});
document.querySelectorAll('.col').forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add('over')};c.ondragleave=()=>c.classList.remove('over');c.ondrop=e=>{e.preventDefault();setSt(+e.dataTransfer.getData('text/plain'),c.dataset.col)}})}

function setSt(id,st){const t=S.tasks.find(x=>x.id===id);if(!t||t.st===st)return render();
if(st==='block'&&!t.why){const w=prompt('Lý do bị chặn?');if(!w)return render();t.why=w}
const dp=S.tasks.find(x=>x.id===t.dep);if(st==='done'&&dp&&dp.st!=='done')toast('Lưu ý: nhiệm vụ phụ thuộc "'+dp.t+'" chưa hoàn thành');
if(st==='done'&&t.steps)t.steps.forEach(x=>x.d=1);t.st=st;save();render();toast('Đã chuyển sang "'+STN[st]+'"')}
function del(id){const t=S.tasks.find(x=>x.id===id);open_(`<h2>Xóa nhiệm vụ?</h2><p>“${esc(t.t)}” sẽ bị xóa khỏi bản demo.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-x>Hủy</button><button class="btn d" id="yes">Xóa</button></div>`);$('#yes').onclick=()=>{S.tasks=S.tasks.filter(x=>x.id!==id);S.tasks.forEach(x=>{if(x.dep===id)delete x.dep});save();close_();render();toast('Đã xóa')}}
function open_(h){$('#mbox').innerHTML=h;$('#modal').classList.add('show');$('#mbox').querySelectorAll('[data-x]').forEach(b=>b.onclick=close_);const f=$('#mbox').querySelector('input,select,button');f&&f.focus()}
function close_(){$('#modal').classList.remove('show')}
function edit(id){
const t=id?S.tasks.find(x=>x.id===id):{p:cur||S.projects[0].id,t:'',as:S.me?0:-1,st:'todo',pr:'normal',s:today(),d:off(7),w:1};
const iso=x=>new Date(x-new Date(x).getTimezoneOffset()*6e4).toISOString().slice(0,10);
open_(`<h2>${id?'Sửa':'Thêm'} nhiệm vụ</h2><div class="fld"><label for="f1">Tên *</label><input id="f1" value="${esc(t.t)}" maxlength="120"><span class="err" id="e1"></span></div>
<div class="fld"><label for="f2">Đồ án</label><select id="f2">${S.projects.map(p=>`<option value="${p.id}" ${p.id==t.p?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
<div class="fld"><label for="f3">Phụ trách</label><select id="f3"><option value="-1" ${t.as<0?'selected':''}>Chưa phân công</option>${S.me?`<option value="0" ${t.as===0?'selected':''}>Tôi (${esc(S.me)})</option>`:''}</select></div>
<div class="fld"><label for="f4">Hạn *</label><input type="date" id="f4" value="${iso(t.d)}"><span class="err" id="e4"></span></div>
<div class="fld"><label for="f5">Ưu tiên</label><select id="f5">${Object.entries(PR).map(([k,v])=>`<option value="${k}" ${k==t.pr?'selected':''}>${v}</option>`).join('')}</select></div>
<div class="fld"><label for="f6">Trạng thái</label><select id="f6">${ST.map(s=>`<option value="${s[0]}" ${s[0]==t.st?'selected':''}>${s[1]}</option>`).join('')}</select></div>
<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-x>Hủy</button><button class="btn p" id="ok">Lưu</button></div>`);
$('#ok').onclick=()=>{const n=$('#f1').value.trim(),d=$('#f4').value;$('#e1').textContent=n?'':'Vui lòng nhập tên nhiệm vụ';$('#e4').textContent=d?'':'Vui lòng chọn hạn';if(!n||!d)return;
const dd=new Date(d+'T00:00:00').getTime();const o={...t,t:n,p:+$('#f2').value,as:+$('#f3').value,d:dd,pr:$('#f5').value,st:$('#f6').value};
if(o.s>dd)o.s=dd;
if(o.st==='block'&&!o.why)o.why='Chưa ghi lý do';
if(id)Object.assign(t,o);else S.tasks.push({...o,id:S.nid++});
save();close_();render();toast('Đã lưu nhiệm vụ')}}

/* Trợ lý — chế độ không dùng AI: trả lời bằng luật dựa trên dữ liệu hiện có */
function answer(q){if(!list().length)return 'Chưa có nhiệm vụ nào để phân tích. Hãy tạo đồ án và nhập nhiệm vụ trước.';q=q.toLowerCase();const a=list(),ov=a.filter(over),sn=a.filter(soon),bl=a.filter(t=>t.st==='block'),L=x=>x.map(t=>`• ${t.t} (hạn ${fmt(t.d)})`).join('\n')||'• (không có)';
if(/trễ|quá hạn|nguy cơ|chậm/.test(q))return `Dữ liệu hiện có:\nQuá hạn (${ov.length}):\n${L(ov)}\nSắp đến hạn (${sn.length}):\n${L(sn)}\n\nGợi ý: xử lý nhiệm vụ quá hạn có nhiều nhiệm vụ phụ thuộc phía sau trước. Đây là gợi ý theo quy tắc, chưa kết luận nguyên nhân.`;
if(/chặn|block/.test(q))return `Nhiệm vụ bị chặn (${bl.length}):\n${bl.map(t=>`• ${t.t} — ${t.why||'chưa ghi lý do'}`).join('\n')||'• (không có)'}`;
if(/tuần|kế hoạch|7 ngày/.test(q)){const w=a.filter(t=>t.st!=='done'&&t.d<=off(7)).sort((x,y)=>x.d-y.d);return `Việc cần xong trong 7 ngày tới (${w.length}):\n${L(w)}\n\nĐề xuất: làm theo thứ tự hạn gần nhất, ưu tiên việc đang chặn nhiệm vụ khác.`}
if(/tóm tắt|tình hình|tiến độ|báo cáo/.test(q))return `Tiến độ theo trọng số: ${prog(a)}%\nHoàn thành: ${a.filter(t=>t.st==='done').length}/${a.length}\nQuá hạn: ${ov.length} · Bị chặn: ${bl.length} · Sắp đến hạn: ${sn.length}`;
return 'Tôi đang ở chế độ không dùng AI nên chỉ trả lời được các câu về: nguy cơ trễ hạn, nhiệm vụ bị chặn, kế hoạch 7 ngày và tóm tắt tiến độ. Tôi không có thông tin về quy chế đồ án của TNUT — hãy xem trang chính thức tnut.edu.vn.'}
function say(c,t){const m=document.createElement('div');m.className=c;m.textContent=t;$('#msgs').append(m);$('#msgs').scrollTop=1e9}
const QS=['Nhiệm vụ nào có nguy cơ trễ hạn?','Nhiệm vụ nào đang bị chặn?','Kế hoạch 7 ngày tới','Tóm tắt tiến độ'];
function ask(q){if(!q.trim())return;say('m1',q);say('m2',answer(q))}

$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.ai)return $('#chat').classList.add('show');go(b.dataset.v)};
function fillProj(){$('#proj').innerHTML='<option value="0">Tất cả đồ án</option>'+S.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('#proj').value=cur;$('#pn').textContent=S.me||'Hồ sơ'}
$('#proj').onchange=e=>{cur=+e.target.value;render()};
$('#addTop').onclick=()=>S.projects.length?edit(0):toast('Hãy tạo đồ án trước');
$('#newP').onclick=newProj;$('#prof').onclick=profile;
$('#menu').onclick=()=>$('#side').classList.toggle('open');
$('#collapse').onclick=()=>$('#side').classList.toggle('min');
$('#theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
$('#modal').onclick=e=>{if(e.target.id==='modal')close_()};
document.onkeydown=e=>{if(e.key==='Escape'){close_();$('#chat').classList.remove('show')}};
$('#fab').onclick=()=>$('#chat').classList.toggle('show');$('#cx').onclick=()=>$('#chat').classList.remove('show');
$('#cf').onsubmit=e=>{e.preventDefault();ask($('#ci').value);$('#ci').value=''};
$('#chips').innerHTML=QS.map(q=>`<button type="button">${q}</button>`).join('');$('#chips').onclick=e=>{if(e.target.tagName==='BUTTON')ask(e.target.textContent)};
say('m2','Xin chào! Tôi là ProjectHub — đang chạy ở chế độ không dùng AI, trả lời dựa trên dữ liệu bạn đã nhập. Chọn một gợi ý bên dưới nhé.');
render();
</script>
</body>
</html>
